<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habiterate | Guilt-Free Tracking</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Tailwind Color Configuration -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: '#2e3d58',
                        cream: '#eeeae2',
                        olive: '#8d8c72',
                        slate: '#67746e',
                        mustard: '#ba955c',
                    }
                }
            }
        }
    </script>

    <!-- Link to your external JavaScript file -->
    <script src="app.js" defer></script>
</head>
<body class="bg-cream text-navy font-sans antialiased min-h-screen">

    <!-- Navigation Bar -->
    <nav class="bg-navy text-cream p-4 flex justify-between items-center shadow-md sticky top-0 z-50">
        <div class="font-bold text-xl tracking-wider">Habiterate</div>
        <div class="flex space-x-6 font-semibold">
            <button onclick="switchTab('main')" id="nav-main" class="text-mustard hover:text-cream transition-colors border-b-2 border-mustard">Dashboard</button>
            <button onclick="switchTab('motivation')" id="nav-motivation" class="hover:text-mustard transition-colors border-b-2 border-transparent">Motivation</button>
        </div>
    </nav>

    <!-- MAIN PAGE: Dashboard -->
    <main id="main-page" class="max-w-3xl mx-auto p-6 block">
        <h1 class="text-3xl font-bold mb-2">Today's Focus</h1>
        <p class="text-slate mb-8">Log partial wins. Keep your momentum going.</p>

        <!-- Add Habit Form -->
        <div class="bg-white p-6 rounded-xl shadow-sm mb-8 border border-gray-200">
            <h2 class="text-xl font-bold text-navy mb-4">Start a New Iteration</h2>
            <div class="flex gap-4">
                <input type="text" id="new-habit-input" placeholder="e.g., Read 10 pages" class="flex-1 p-3 border border-gray-300 rounded-lg focus:outline-none focus:border-mustard">
                <button onclick="addHabit()" class="bg-navy hover:bg-slate text-cream px-6 py-3 rounded-lg font-bold transition-colors">Add Habit</button>
            </div>
            <p id="rule-of-three-warning" class="text-mustard text-sm font-bold mt-2 hidden">Rule of Three Active: Please archive a habit before adding a new one.</p>
        </div>

        <!-- Habits List Container -->
        <div id="habits-container" class="space-y-6">
            <!-- JavaScript will render the habit cards here -->
        </div>
    </main>

    <!-- MOTIVATION PAGE -->
    <main id="motivation-page" class="hidden max-w-2xl mx-auto p-6 flex-col items-center justify-center min-h-[70vh] text-center">
        <div class="bg-white p-10 rounded-2xl shadow-lg border-l-8 border-mustard w-full mt-10">
            <p id="quote-text" class="text-3xl text-navy italic mb-6 font-serif leading-snug">
                "Success is the sum of small efforts, repeated day in and day out."
            </p>
            <p id="quote-author" class="text-xl text-slate font-semibold tracking-wide">
                - Robert Collier
            </p>
            <button onclick="generateQuote()" class="mt-10 bg-olive hover:bg-slate text-cream py-4 px-8 rounded-xl font-bold text-lg transition-transform transform hover:scale-105 shadow-md">
                Draw Another Spark
            </button>
        </div>
    </main>

</body>
</html>
